version: 2
updates:
  # Only versioned image references are tracked: today that is the PIE image.
  # The php and dunglas/frankenphp bases follow PHP_VERSION, and composer:2
  # and caddy:builder float on purpose.
  - package-ecosystem: "docker"
    directories:
      - "/php8/*"
    schedule:
      interval: "weekly"
    groups:
      # One PR per image across all four variants, not one per Dockerfile.
      docker-images:
        patterns:
          - "*"
        group-by: dependency-name

  # The Caddy modules the FrankenPHP image adds on top of upstream. The build
  # reads their versions from this go.mod. caddy-ratelimit is pinned to a
  # commit, so it only gets PRs once upstream tags a newer release.
  - package-ecosystem: "gomod"
    directory: "/php8/frankenphp-trixie/modules"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    groups:
      caddy-modules:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "actions/*"
      docker-actions:
        patterns:
          - "docker/*"
