# Deterministic phase 1 blocks for requests that a Drupal site never serves.
# They run before the request body is read and do not depend on CRS scoring.
#
# Rule ids 10000-10999 are reserved for this file. To drop one for a project,
# add "SecRuleRemoveById <id>" to a later file such as 90-project.conf.
# In DetectionOnly mode these rules only log.

# 10001: PHP scripts other than the Drupal front controllers. Caddy runs the
# script up to the first ".php" and passes the rest as PATH_INFO, so the match
# is on ".php" anywhere in the decoded path (any case), and the allowed names
# must be followed by "/" or the end of the path. Drupal core keeps install,
# authorize, rebuild and update also under /core/.
SecRule REQUEST_FILENAME "@rx (?i)\.php" \
    "id:10001,phase:1,deny,status:403,log,auditlog,severity:'CRITICAL',t:none,t:urlDecodeUni,t:normalizePath,msg:'PHP script other than a Drupal front controller',tag:'drupal-scanner',chain"
    SecRule REQUEST_FILENAME "!@rx (?i)^/(?:core/)?(?:index|update|cron|authorize|install|rebuild)\.php(?:/|$)" \
        "t:none,t:urlDecodeUni,t:normalizePath"

# 10002: hidden files and directories that hold secrets or source control
# data. /.well-known/ is not listed and stays reachable.
SecRule REQUEST_FILENAME "@rx (?i)^/\.(?:env|git|svn|hg|bzr|aws|ssh|docker|kube|npmrc|htpasswd|htaccess|ds_store|idea|vscode)(?:[/.]|$)" \
    "id:10002,phase:1,deny,status:403,log,auditlog,severity:'CRITICAL',t:none,t:urlDecodeUni,t:normalizePath,msg:'Probe for a hidden file or directory',tag:'drupal-scanner'"

# 10003: paths of other applications and tools that scanners look for.
SecRule REQUEST_FILENAME "@rx (?i)^/(?:wp-admin|wp-content|wp-includes|wp-json|phpmyadmin|pma|myadmin|adminer|_ignition|_profiler|cgi-bin|server-status|actuator|vendor)(?:/|$)" \
    "id:10003,phase:1,deny,status:403,log,auditlog,severity:'CRITICAL',t:none,t:urlDecodeUni,t:normalizePath,msg:'Probe for a path of another application',tag:'drupal-scanner'"
