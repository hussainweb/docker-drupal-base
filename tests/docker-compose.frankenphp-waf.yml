# Override for the FrankenPHP variant: turns on the opt-in WAF, with a project rules file.
# Layered over tests/docker-compose.yml by the CI step that runs tests/verify-frankenphp-waf.sh enabled.
services:
  drupal:
    environment:
      WAF_SNIPPET: /etc/frankenphp/waf/enabled.caddy
    volumes:
      - ./waf-rules/90-project.conf:/etc/frankenphp/waf/rules/90-project.conf:ro
