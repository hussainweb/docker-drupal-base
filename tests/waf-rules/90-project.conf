# Project rules used by tests/verify-frankenphp-waf.sh: proves that files
# dropped into /etc/frankenphp/waf/rules/ are included after the defaults.

# A project rule of its own
SecRule REQUEST_FILENAME "@beginsWith /project-rule-test" \
    "id:90001,phase:1,deny,status:403,log,msg:'Project rule'"

# A project can drop a default rule it does not want (here: /wp-json)
SecRuleRemoveById 10003
SecRule REQUEST_FILENAME "@rx (?i)^/(?:wp-admin|wp-content|wp-includes|phpmyadmin|_ignition|cgi-bin)(?:/|$)" \
    "id:90002,phase:1,deny,status:403,log,msg:'Project copy of 10003 without wp-json'"
